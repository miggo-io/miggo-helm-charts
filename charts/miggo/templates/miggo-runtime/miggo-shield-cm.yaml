{{- if and .Values.miggoRuntime.enabled .Values.miggoRuntime.profiler.enabled .Values.miggoRuntime.shield.config }}
{{- $tracers := .Values.miggoRuntime.profiler.enabledTracers }}
{{- if not (and (has "python" $tracers) (has "hotspot" $tracers)) }}
{{- fail "miggoRuntime.shield.config is set, so miggoRuntime.profiler.enabledTracers must include both \"python\" and \"hotspot\": the blocker's argv-capture programs reference both runtimes' process maps, and the profiler refuses to start without them." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: profiler-miggo-shield
  namespace: {{ include "miggo.namespace" . }}
data:
  # The chart owns only the kind/version envelope; the body is passed through as
  # written, so policy can be copied from the sensor's docs unchanged.
  miggo-shield.yaml: |
    kind: MiggoShield
    version: v1
    config:
      {{- toYaml .Values.miggoRuntime.shield.config | nindent 6 }}
{{- end }}
