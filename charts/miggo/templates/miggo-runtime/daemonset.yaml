{{ if .Values.miggoRuntime.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "miggo.fullname" . }}-runtime
  namespace: {{ include "miggo.namespace" . }}
  labels:
    {{- include "miggo.labels" . | nindent 4 }}
    {{- with .Values.labels }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
    {{- with .Values.miggoRuntime.labels }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
  annotations:
  {{- with .Values.annotations }}
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
  {{- with .Values.miggoRuntime.annotations }}
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
    {{- include "miggoRuntime.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if and .Values.miggoRuntime.profiler.enabled .Values.miggoRuntime.shield.config }}
        checksum/miggo-shield: {{ include (print $.Template.BasePath "/miggo-runtime/miggo-shield-cm.yaml") . | sha256sum }}
        {{- end }}
      {{- with .Values.podAnnotations }}
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with .Values.miggoRuntime.podAnnotations }}
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      labels:
        component: miggo-runtime
        {{- include "miggoRuntime.labels" . | nindent 8 }}
        {{- if .Values.pprof.port }}
        miggo.io/pprof-port: {{ .Values.pprof.port | quote }}
        {{- end }}
        {{- with .Values.podLabels }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
        {{- with .Values.miggoRuntime.podLabels }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
    spec:
      imagePullSecrets:
        {{- with .Values.imagePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- include "miggoImagePullSecrets" . | nindent 8 }}
      serviceAccountName: {{ include "miggo.serviceAccountName" . }}-runtime
      {{- with (include "miggo.podSecurityContext.runtime" .) }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: miggo-runtime
          securityContext:
            {{- toYaml .Values.miggoRuntime.securityContext | nindent 12 }}
          {{- if .Values.miggoRuntime.image.fullPath }}
          image: "{{ .Values.miggoRuntime.image.fullPath }}"
          {{- else }}
          image: "{{ .Values.image.registry }}/{{ .Values.miggoRuntime.image.repository }}:{{ .Values.miggoRuntime.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.miggoRuntime.image.pullPolicy | default .Values.image.pullPolicy }}
          args:
            - --cluster-name={{ .Values.miggo.clusterName }}
            - --otlp-endpoint={{ (include "otlpEndpoint" .) }}
            - --collector-healthcheck-port={{ (include "otlpEndpointHealthCheckPort" .) }}
            - --tls-skip-verify={{ (include "otlpTlsSkipVerify" .) }}
            - --stdout={{ .Values.output.stdout }}
            - --port={{ .Values.healthcheck.port }}
            - --metric-otlp-endpoint={{ (include "otlpEndpoint" .) }}
            - --metric-tls-skip-verify={{ (include "otlpTlsSkipVerify" .) }}
            - --metric-interval={{ .Values.config.metrics.interval }}
            - --chart-version={{ .Chart.Version }}
            - --disable-profiler={{ not .Values.miggoRuntime.profiler.enabled }}
            - --enable-network-tracing={{ .Values.miggoRuntime.enableNetworkTracing }}
            - --enable-file-access-tracing={{ .Values.miggoRuntime.enableFileAccessTracing }}
            - --enable-web-app-process-detection={{ .Values.miggoRuntime.enableWebAppProcessDetection }}
            - --cgroup-registry-sync-interval={{ .Values.miggoRuntime.cgroupRegistrySyncInterval }}
            - --cgroup-registry-clean-interval={{ .Values.miggoRuntime.cgroupRegistryCleanInterval }}
            - --cgroup-root-dir=/cgroup
            - --pprof-port={{ .Values.pprof.port }}
            
            - --profiles-otlp-endpoint={{ (include "otlpProfilesEndpoint" .) }}
            - --profiler-reporter-interval={{ .Values.miggoRuntime.profiler.reporterInterval }}
            - --profiler-samples-per-second={{ .Values.miggoRuntime.profiler.samplesPerSecond }}
            - --profiler-monitor-interval={{ .Values.miggoRuntime.profiler.monitorInterval }}
            - --profiler-probabilistic-threshold={{ .Values.miggoRuntime.profiler.probabilisticThreshold }}
            - --profiler-probabilistic-interval={{ .Values.miggoRuntime.profiler.probabilisticInterval }}
            - --profiler-tracers={{ join "," .Values.miggoRuntime.profiler.enabledTracers }}
            - --profiler-enable-cgroup-filter={{ .Values.miggoRuntime.profiler.enableNamespaceFiltering }}
            {{- if .Values.miggoRuntime.shield.config }}
            - --shield-config=/etc/miggo/miggo-shield.yaml
            {{- end }}
            
            {{- include "namespace.flags" . | nindent 12 }}
          {{- range $key, $value := .Values.miggoRuntime.extraArgs }}
            {{- if kindIs "invalid" $value }}
            - --{{ $key }}
            {{- else }}
            - --{{ $key }}={{ $value }}
            {{- end }}
          {{- end }}
          {{- range $key, $value := .Values.miggoRuntime.profiler.extraArgs }}
            {{- if kindIs "invalid" $value }}
            - --{{ $key }}
            {{- else }}
            - --{{ $key }}={{ $value }}
            {{- end }}
          {{- end }}
          
          envFrom:
          {{- with .Values.extraEnvsFrom }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .Values.miggoRuntime.extraEnvsFrom }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          env:
          {{- if and .Values.miggoRuntime.useGOMEMLIMIT .Values.miggoRuntime.resources.requests.memory }}
          - name: GOMEMLIMIT
            value: {{ include "gomemlimit" .Values.miggoRuntime.resources.requests.memory | quote }}
          {{- end }}
          - name: MIGGO_RUNTIME_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: MIGGO_RUNTIME_INSTANCE_ID
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: KUBERNETES_CLUSTER_DOMAIN
            value: {{ quote .Values.kubernetesClusterDomain }}
          {{- with .Values.miggoRuntime.profiler.dotnet.peCacheSize }}
          - name: MIGGO_DOTNET_PE_CACHE_SIZE
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.miggoRuntime.profiler.dotnet.peCacheTTL }}
          - name: MIGGO_DOTNET_PE_CACHE_TTL
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.miggoRuntime.profiler.dotnet.stringsCacheSize }}
          - name: MIGGO_DOTNET_STRINGS_CACHE_SIZE
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.miggoRuntime.profiler.dotnet.stringsCacheTTL }}
          - name: MIGGO_DOTNET_STRINGS_CACHE_TTL
            value: {{ . | quote }}
          {{- end }}
          {{- with .Values.extraEnvs }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .Values.miggoRuntime.extraEnvs }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          ports:
          - containerPort: {{ .Values.healthcheck.port }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.healthcheck.port }}
            periodSeconds: 10
            timeoutSeconds: {{ coalesce .Values.miggoRuntime.probes.timeoutSeconds .Values.probes.timeoutSeconds }}
            failureThreshold: {{ coalesce .Values.miggoRuntime.probes.failureThreshold .Values.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.healthcheck.port }}
            periodSeconds: 10
            timeoutSeconds: {{ coalesce .Values.miggoRuntime.probes.timeoutSeconds .Values.probes.timeoutSeconds }}
            failureThreshold: {{ coalesce .Values.miggoRuntime.probes.failureThreshold .Values.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.miggoRuntime.resources | nindent 12 }}
          volumeMounts:
          - name: debugfs
            mountPath: /sys/kernel/debug
            readOnly: true
          - name: tracefs
            mountPath: /sys/kernel/tracing
            readOnly: true
          - name: cgroupfs
            mountPath: /cgroup
            readOnly: true
          {{- if .Values.miggoRuntime.shield.config }}
          - name: miggo-shield
            mountPath: /etc/miggo
            readOnly: true
          {{- end }}
          {{- with .Values.volumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .Values.miggoRuntime.volumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
      hostIPC: {{ .Values.miggoRuntime.hostIPC }}
      hostPID: {{ .Values.miggoRuntime.hostPID }}
      volumes:
      - name: debugfs
        hostPath:
          path: /sys/kernel/debug
      - name: tracefs
        hostPath:
          path: /sys/kernel/tracing
      - name: unix-socket
        emptyDir: { }
      - name: cgroupfs
        hostPath:
          path: /sys/fs/cgroup
      {{- if and .Values.miggoRuntime.profiler.enabled .Values.miggoRuntime.shield.config }}
      - name: miggo-shield
        configMap:
          name: profiler-miggo-shield
      {{- end }}
      {{- with .Values.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.miggoRuntime.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      nodeSelector:
      {{- with .Values.nodeSelector }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.miggoRuntime.nodeSelector }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.affinity .Values.miggoRuntime.affinity }}
      affinity:
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.miggoRuntime.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if or .Values.tolerations .Values.miggoRuntime.tolerations }}
      tolerations:
        {{- with .Values.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.miggoRuntime.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- $priorityClassName := .Values.miggoRuntime.priorityClassName | default .Values.priorityClassName | default "system-node-critical" }}
      {{- if $priorityClassName }}
      priorityClassName: {{ $priorityClassName }}
      {{- end }}
{{ end }}
