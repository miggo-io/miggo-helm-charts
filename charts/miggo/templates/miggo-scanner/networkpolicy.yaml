{{- if .Values.networkPolicy.enabled }}
{{- if .Values.miggoScanner.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "miggo.fullname" . }}-scanner
  namespace: {{ include "miggo.namespace" . }}
  labels:
    {{- include "miggo-scanner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "miggo-scanner.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.healthcheck.port }}
    {{- if .Values.pprof.port }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "miggo-collector.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.pprof.port }}
    {{- end }}
{{- end }}
{{- end }}
