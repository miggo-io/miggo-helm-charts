{{- if and .Values.miggoCollector.enabled .Values.config.mtls.enabled }}
  {{- if .Values.config.mtls.secret.create }}
    {{- $_ := required "config.mtls.secret.crt and config.mtls.secret.key are required when config.mtls.secret.create is true" .Values.config.mtls.secret.crt }}
    {{- $_ := required "config.mtls.secret.crt and config.mtls.secret.key are required when config.mtls.secret.create is true" .Values.config.mtls.secret.key }}
  {{- else }}
    {{- $_ := required "config.mtls.secret.name is required when config.mtls.secret.create is false" .Values.config.mtls.secret.name }}
  {{- end }}
{{- end }}
{{- if and .Values.miggoCollector.enabled .Values.config.mtls.enabled .Values.config.mtls.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "miggo.secret.mtls" . }}
  namespace: {{ include "miggo.namespace" . }}
  {{- with .Values.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.config.mtls.secret.crt | b64enc | quote }}
  tls.key: {{ .Values.config.mtls.secret.key | b64enc | quote }}
{{- end }}
