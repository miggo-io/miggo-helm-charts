suite: collector per node

release:
  name: miggo
  namespace: miggo-space

templates:
  - templates/miggo-collector/deployment.yaml
  - templates/miggo-collector/service.yaml
  - templates/miggo-collector/collector-config-cm.yaml
  - templates/miggo-collector/diagnostic-pprof-config-cm.yaml
  - templates/miggo-collector/heartbeat-debug-config-cm.yaml
  - templates/miggo-scanner/deployment.yaml

values:
  - values.yaml

tests:

  - it: collector per node by default
    template: templates/miggo-collector/deployment.yaml
    asserts:
      - isKind:
          of: DaemonSet
      - isNull:
          path: spec.replicas

  - it: collector per node service by default
    template: templates/miggo-collector/service.yaml
    asserts:
      - equal:
          path: spec.internalTrafficPolicy
          value: Local

  - it: scanner cache generation follows the default collector per node
    template: templates/miggo-scanner/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-scanner")].args
          content: --cache-generation=collector-daemonset

  - it: collector per node
    template: templates/miggo-collector/deployment.yaml
    set:
      miggoCollector:
        instancePerNode: true
    asserts:
      - isKind:
          of: DaemonSet
      - isNull:
          path: spec.replicas

  - it: collector per node service
    template: templates/miggo-collector/service.yaml
    set:
      miggoCollector:
        instancePerNode: true
    asserts:
      - equal:
          path: spec.internalTrafficPolicy
          value: Local

  - it: global collector
    template: templates/miggo-collector/deployment.yaml
    set:
      miggoCollector:
        instancePerNode: false
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1

  - it: global collector replicas
    template: templates/miggo-collector/deployment.yaml
    set:
      miggoCollector:
        instancePerNode: false
        replicas: 5
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 5

  - it: global collector service
    template: templates/miggo-collector/service.yaml
    set:
      miggoCollector:
        instancePerNode: false
    asserts:
      - isNull:
          path: spec.internalTrafficPolicy

  - it: scanner cache generation follows a collector per node
    template: templates/miggo-scanner/deployment.yaml
    set:
      miggoCollector:
        instancePerNode: true
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-scanner")].args
          content: --cache-generation=collector-daemonset

  - it: scanner cache generation follows a global collector
    template: templates/miggo-scanner/deployment.yaml
    set:
      miggoCollector:
        instancePerNode: false
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-scanner")].args
          content: --cache-generation=collector-deployment

  - it: scanner cache generation ignores instancePerNode with the collector disabled
    template: templates/miggo-scanner/deployment.yaml
    set:
      miggoCollector:
        enabled: false
        instancePerNode: true
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-scanner")].args
          content: --cache-generation=collector-disabled

  - it: disabled configmap cache passes no scanner cache generation
    template: templates/miggo-scanner/deployment.yaml
    set:
      miggoCollector:
        instancePerNode: true
      miggoScanner:
        config:
          cache:
            configMap:
              enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[?(@.name == "miggo-scanner")].args
          content: --cache-generation=collector-daemonset
