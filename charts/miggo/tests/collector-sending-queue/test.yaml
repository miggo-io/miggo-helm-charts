suite: miggoCollector.sendingQueue — exporter queues bounded in bytes from the memory limit

release:
  name: miggo
  namespace: miggo-space

values:
  - values.yaml

tests:
  - it: sizes the otlp_http queue at 3% of the default 500Mi limit
    template: templates/miggo-collector/collector-config-cm.yaml
    asserts:
      - matchRegex:
          path: data["config-template.yaml"]
          pattern: "(?s)otlp_http:.*?sending_queue:\\n\\s+sizer: bytes\\n\\s+queue_size: 15728640\\n"

  - it: sizes the otlp_http queue from a binary-unit limit
    template: templates/miggo-collector/collector-config-cm.yaml
    set:
      miggoCollector:
        resources:
          limits:
            memory: 2Gi
    asserts:
      - matchRegex:
          path: data["config-template.yaml"]
          pattern: "(?s)otlp_http:.*?sending_queue:\\n\\s+sizer: bytes\\n\\s+queue_size: 64424509\\n"

  - it: sizes the otlp_http queue from a decimal-unit limit and a custom percentage
    template: templates/miggo-collector/collector-config-cm.yaml
    set:
      miggoCollector:
        resources:
          limits:
            memory: 1G
        sendingQueue:
          memoryPercent: 10
    asserts:
      - matchRegex:
          path: data["config-template.yaml"]
          pattern: "(?s)otlp_http:.*?sending_queue:\\n\\s+sizer: bytes\\n\\s+queue_size: 100000000\\n"

  - it: sizes the diagnostics queue from the memory limit
    template: templates/miggo-collector/diagnostic-pprof-config-cm.yaml
    set:
      miggoCollector:
        resources:
          limits:
            memory: 2Gi
    asserts:
      - matchRegex:
          path: data["diagnostic-pprof.yaml"]
          pattern: "(?s)otlp_http/diagnostics:.*?sending_queue:\\n\\s+sizer: bytes\\n\\s+queue_size: 21474836\\n"

  - it: keeps the exporter default queue without a memory limit
    template: templates/miggo-collector/collector-config-cm.yaml
    set:
      miggoCollector:
        resources:
          limits:
            memory: null
    asserts:
      - notMatchRegex:
          path: data["config-template.yaml"]
          pattern: "sending_queue:"

  - it: keeps the exporter default queue when the percentage is 0
    template: templates/miggo-collector/collector-config-cm.yaml
    set:
      miggoCollector:
        sendingQueue:
          memoryPercent: 0
    asserts:
      - notMatchRegex:
          path: data["config-template.yaml"]
          pattern: "sending_queue:"
