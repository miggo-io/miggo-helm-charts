suite: simple installation

release:
  name: miggo
  namespace: miggo-space

templates:
  - templates/miggo-watch/deployment.yaml
  - templates/miggo-scanner/deployment.yaml
  - templates/miggo-runtime/daemonset.yaml
  - templates/miggo-collector/deployment.yaml
  - templates/miggo-collector/collector-config-cm.yaml
  - templates/miggo-collector/diagnostic-pprof-config-cm.yaml
  - templates/miggo-collector/heartbeat-debug-config-cm.yaml

values:
  - values.yaml

tests:
  - it: miggo-watch config
    template: templates/miggo-watch/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-watch")].args
          content: --interval=1h
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-watch")].args
          content: --disable-compression
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-watch")].args
          content: --exclude=pod, statefulset

  - it: miggo-scanner config
    template: templates/miggo-scanner/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-scanner")].args
          content: --queue-size=4321
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-scanner")].args
          content: --disable-compression
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-scanner")].args
          content: --cache-size=1234
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-scanner")].args
          content: --cache-flush-interval=1m
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-scanner")].args
          content: --cache-cleanup-interval=30m
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-scanner")].args
          content: --cache-cm-name=test

  - it: miggo-runtime config
    template: templates/miggo-runtime/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          content: --metric-interval=1h

  # GOMEMLIMIT follows miggoRuntime.useGOMEMLIMIT and resources; the profiler's own keys no longer apply.
  - it: miggo-runtime useGOMEMLIMIT
    template: templates/miggo-runtime/daemonset.yaml
    set:
      miggoRuntime:
        useGOMEMLIMIT: false
        profiler:
          useGOMEMLIMIT: true
          enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].env[?(@.name == "GOMEMLIMIT")]

  - it: miggo-runtime GOMEMLIMIT is 80% of the runtime's memory request
    template: templates/miggo-runtime/daemonset.yaml
    set:
      miggoRuntime:
        resources:
          requests:
            memory: 1Gi
        profiler:
          resources:
            requests:
              memory: 256Mi
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].env
          content:
            name: GOMEMLIMIT
            value: "819MiB"

  - it: miggo-watch denies its own install namespace by default
    template: templates/miggo-watch/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-watch")].args
          content: --denied-namespaces=miggo-space

  - it: miggo-scanner denies its own install namespace by default
    template: templates/miggo-scanner/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-scanner")].args
          content: --denied-namespaces=miggo-space

  - it: miggo-runtime denies its own install namespace by default
    template: templates/miggo-runtime/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          content: --denied-namespaces=miggo-space

  - it: user-supplied deniedNamespaces are appended after the install namespace
    template: templates/miggo-watch/deployment.yaml
    set:
      config:
        deniedNamespaces:
          - test
          - deprecated
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-watch")].args
          content: --denied-namespaces=miggo-space,test,deprecated
