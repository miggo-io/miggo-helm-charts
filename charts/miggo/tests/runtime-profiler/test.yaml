suite: runtime profiler

release:
  name: miggo
  namespace: miggo-space

templates:
  - templates/miggo-collector/deployment.yaml
  - templates/miggo-collector/collector-config-cm.yaml
  - templates/miggo-collector/diagnostic-pprof-config-cm.yaml
  - templates/miggo-collector/heartbeat-debug-config-cm.yaml
  - templates/miggo-runtime/daemonset.yaml
  - templates/miggo-runtime/miggo-shield-cm.yaml

values:
  - values.yaml

tests:
  - it: should configure collector to enable profiles signal
    template: templates/miggo-collector/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-collector")].args
          value:
            - --config
            - /etc/collector/config.yaml
            - --config
            - /etc/collector/heartbeat-debug.yaml
            - --feature-gates
            - service.profilesSupport
  - it: should configure collector to receive and export profiles
    template: templates/miggo-collector/collector-config-cm.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["config-template.yaml"]
          pattern: |
            .*otlp_http:
              +traces_endpoint: https://collector\.miggo\.io/v1/traces
              +metrics_endpoint: https://collector\.miggo\.io/v1/metrics
              +logs_endpoint: https://collector\.miggo\.io/v1/logs
              +profiles_endpoint: https://collector\.miggo\.io/v1development/profiles
              +auth:
                +authenticator: oauth2client.*
      - matchRegex:
          path: data["config-template.yaml"]
          pattern: |
            (?s).*pipelines:.*profiles:\s+receivers:\s+-\s+otlp\s+exporters:\s+-\s+otlp_http\s.*

  # miggoRuntime.profiler.enabled has no effect: the profiler runs inside the runtime,
  # so the collector's profiles path follows miggoRuntime.enabled alone.
  - it: should keep the profiles pipeline when the runtime is enabled, even with profiler.enabled false
    template: templates/miggo-collector/collector-config-cm.yaml
    set:
      miggoRuntime.profiler.enabled: false
    asserts:
      - matchRegex:
          path: data["config-template.yaml"]
          pattern: |
            (?s).*pipelines:.*profiles:\s+receivers:\s+-\s+otlp\s+exporters:\s+-\s+otlp_http\s.*

  - it: should keep the profilesSupport feature gate when the runtime is enabled, even with profiler.enabled false
    template: templates/miggo-collector/deployment.yaml
    set:
      miggoRuntime.profiler.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-collector")].args
          content: service.profilesSupport

  - it: should drop the profiles pipeline when the runtime is disabled, even with profiler.enabled true
    template: templates/miggo-collector/collector-config-cm.yaml
    set:
      miggoRuntime.enabled: false
      miggoRuntime.profiler.enabled: true
    asserts:
      - notMatchRegex:
          path: data["config-template.yaml"]
          pattern: |
            (?s).*pipelines:.*profiles:\s+receivers:.*

  - it: should drop the profilesSupport feature gate when the runtime is disabled, even with profiler.enabled true
    template: templates/miggo-collector/deployment.yaml
    set:
      miggoRuntime.enabled: false
      miggoRuntime.profiler.enabled: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[?(@.name == "miggo-collector")].args
          content: service.profilesSupport

  - it: should run the profiler inside the miggo-runtime container
    template: templates/miggo-runtime/daemonset.yaml
    chart:
      version: '1.0.0'
      appVersion: '1.0.0'
    asserts:
      - isKind:
          of: DaemonSet
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: miggo-runtime
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          value:
            - --cluster-name=simple-test
            - --platform=kubernetes
            - --otlp-endpoint=http://miggo-collector.miggo-space.svc.cluster.local:4318
            - --collector-healthcheck-port=6666
            - --tls-skip-verify=false
            - --stdout=false
            - --port=6666
            - --metric-otlp-endpoint=http://miggo-collector.miggo-space.svc.cluster.local:4318
            - --metric-tls-skip-verify=false
            - --metric-interval=60s
            - --chart-version=1.0.0
            - --enable-network-tracing=false
            - --enable-file-access-tracing=false
            - --enable-web-app-process-detection=true
            - --cgroup-registry-sync-interval=1m
            - --cgroup-registry-clean-interval=1h
            - --cgroup-root-dir=/cgroup
            - --pprof-port=0
            - --enable-syscall-to-profile-correlation=false
            - --enable-web-app-process-exec-filtering=true
            - --profiles-otlp-endpoint=miggo-collector.miggo-space.svc.cluster.local:4317
            - --profiler-reporter-interval=5s
            - --profiler-samples-per-second=20
            - --profiler-monitor-interval=5s
            - --profiler-probabilistic-threshold=100
            - --profiler-probabilistic-interval=1m0s
            - --profiler-tracers=perl,php,python,hotspot,v8,go
            - --profiler-load-probe=false
            - --include-system-namespaces=false
            - --denied-namespaces=miggo-space
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].securityContext
          value:
            privileged: true
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].volumeMounts
          value:
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - mountPath: /sys/kernel/tracing
              name: tracefs
              readOnly: true
            - mountPath: /cgroup
              name: cgroupfs
              readOnly: true
      - equal:
          path: spec.template.spec.volumes
          value:
            - name: debugfs
              hostPath:
                path: /sys/kernel/debug
            - name: tracefs
              hostPath:
                path: /sys/kernel/tracing
            - name: cgroupfs
              hostPath:
                path: /sys/fs/cgroup
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].env
          content:
            name: MIGGO_RUNTIME_ENABLE_CGROUP_FILTER
            value: "true"
      - equal:
          path: spec.template.spec.hostPID
          value: true
      - equal:
          path: spec.template.spec.hostIPC
          value: true

  # The runtime ignores --disable-profiler: if the runtime runs, the profiler runs.
  - it: should not pass --disable-profiler, whatever profiler.enabled says
    template: templates/miggo-runtime/daemonset.yaml
    set:
      miggoRuntime.profiler.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          content: --disable-profiler=true
      - notContains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          content: --disable-profiler=false
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          content: --profiles-otlp-endpoint=miggo-collector.miggo-space.svc.cluster.local:4317

  - it: should default the runtime to 700Mi of memory, with GOMEMLIMIT at 80% of it
    template: templates/miggo-runtime/daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].resources
          value:
            requests:
              cpu: 100m
              memory: 700Mi
            limits:
              cpu: 500m
              memory: 700Mi
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].env
          content:
            name: GOMEMLIMIT
            value: "560MiB"

  - it: should enable Off-CPU profiler
    template: templates/miggo-runtime/daemonset.yaml
    set:
      miggoRuntime:
        profiler:
          probabilisticThreshold: 1
    asserts:
      - isKind:
          of: DaemonSet
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          content: --profiler-probabilistic-threshold=1

  - it: should send the profiles to the configured collector when the bundled one is disabled
    template: templates/miggo-runtime/daemonset.yaml
    set:
      miggoCollector.enabled: false
      config.collectorUrl: https://collector.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          content: --profiles-otlp-endpoint=https://collector.example.com

  - it: should render no fluent-bit sidecar
    template: templates/miggo-runtime/daemonset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "profiler-logs")]

  # MiggoShield: no enable flag, so an empty config must leave the blocker
  # entirely unwired rather than mounted-but-inert.
  - it: should not wire the MiggoShield blocker when no policy is configured
    template: templates/miggo-runtime/miggo-shield-cm.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should leave the runtime container untouched when no MiggoShield policy is configured
    template: templates/miggo-runtime/daemonset.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].env
          content:
            name: MIGGO_RUNTIME_SHIELD_CONFIG
            value: /etc/miggo/miggo-shield.yaml
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: miggo-shield
            configMap:
              name: profiler-miggo-shield

  - it: should render the MiggoShield policy under a kind/version envelope
    template: templates/miggo-runtime/miggo-shield-cm.yaml
    set:
      miggoRuntime:
        shield:
          config:
            watched_namespaces:
              - langflow
            python:
              watched_functions:
                - name: validate_code
              block_exec_from:
                - ssti
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: profiler-miggo-shield
      # The chart owns the envelope; the body is the operator's, passed through.
      - matchRegex:
          path: data["miggo-shield.yaml"]
          pattern: |
            ^kind: MiggoShield
            version: v1
            config:
      - matchRegex:
          path: data["miggo-shield.yaml"]
          pattern: 'watched_namespaces:\n  - langflow'
      - matchRegex:
          path: data["miggo-shield.yaml"]
          pattern: 'block_exec_from:\n    - ssti'
      - matchRegex:
          path: data["miggo-shield.yaml"]
          pattern: 'watched_functions:\n    - name: validate_code'

  - it: should mount the MiggoShield policy into the runtime when one is configured
    template: templates/miggo-runtime/daemonset.yaml
    set:
      miggoRuntime:
        shield:
          config:
            python:
              watched_functions:
                - name: validate_code
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].env
          content:
            name: MIGGO_RUNTIME_SHIELD_CONFIG
            value: /etc/miggo/miggo-shield.yaml
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].volumeMounts
          content:
            name: miggo-shield
            mountPath: /etc/miggo
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: miggo-shield
            configMap:
              name: profiler-miggo-shield

  - it: should render the MiggoShield policy whatever profiler.enabled says
    template: templates/miggo-runtime/miggo-shield-cm.yaml
    set:
      miggoRuntime:
        profiler:
          enabled: false
        shield:
          config:
            python:
              watched_functions:
                - name: validate_code
    asserts:
      - hasDocuments:
          count: 1

  # The blocker's argv-capture programs reference both runtimes' process maps, so
  # the profiler refuses to start without both tracers. Fail at install time
  # instead of crash-looping on every node.
  - it: should refuse a MiggoShield policy without the python and hotspot tracers
    template: templates/miggo-runtime/miggo-shield-cm.yaml
    set:
      miggoRuntime:
        profiler:
          enabledTracers: [python, go]
        shield:
          config:
            python:
              watched_functions:
                - name: validate_code
    asserts:
      - failedTemplate:
          errorMessage: 'miggoRuntime.shield.config is set, so miggoRuntime.profiler.enabledTracers must include both "python" and "hotspot": the blocker''s argv-capture programs reference both runtimes'' process maps, and the profiler refuses to start without them.'
  - it: should pass the kubernetes platform to the runtime
    template: templates/miggo-runtime/daemonset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          content: --platform=kubernetes
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].env
          content:
            name: MIGGO_RUNTIME_PLATFORM
            value: kubernetes
