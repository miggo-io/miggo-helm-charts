suite: detections capability

release:
  name: miggo
  namespace: miggo-space

templates:
  - templates/miggo-runtime/daemonset.yaml

values:
  - values.yaml

tests:
  - it: renders the detections flags off when enableDetections is unset
    template: templates/miggo-runtime/daemonset.yaml
    asserts:
      - isKind:
          of: DaemonSet
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          content: --enable-syscall-to-profile-correlation=false
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          content: --enable-web-app-process-exec-filtering=true
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          content: --profiler-load-probe=false

  - it: renders the detections flags on when enableDetections is true
    template: templates/miggo-runtime/daemonset.yaml
    set:
      config.enableDetections: true
    asserts:
      - isKind:
          of: DaemonSet
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          content: --enable-syscall-to-profile-correlation=true
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          content: --enable-web-app-process-exec-filtering=false
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          content: --profiler-load-probe=true

  # The runtime parses with spf13/pflag, which is last-wins: an extraArgs entry only
  # overrides the value enableDetections chose if it is rendered after it.
  - it: places runtime extraArgs after the flags enableDetections renders
    template: templates/miggo-runtime/daemonset.yaml
    chart:
      version: '1.0.0'
      appVersion: '1.0.0'
    set:
      config.enableDetections: true
      miggoRuntime.extraArgs.enable-syscall-to-profile-correlation: false
    asserts:
      - isKind:
          of: DaemonSet
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          value:
            - --cluster-name=detections-test
            - --platform=kubernetes
            - --otlp-endpoint=http://miggo-collector.miggo-space.svc.cluster.local:4318
            - --collector-healthcheck-port=6666
            - --tls-skip-verify=false
            - --stdout=false
            - --port=6666
            - --metric-otlp-endpoint=http://miggo-collector.miggo-space.svc.cluster.local:4318
            - --metric-tls-skip-verify=false
            - --metric-interval=60s
            - --chart-version=1.0.0
            - --enable-network-tracing=false
            - --enable-file-access-tracing=false
            - --enable-web-app-process-detection=true
            - --cgroup-registry-sync-interval=1m
            - --cgroup-registry-clean-interval=1h
            - --cgroup-root-dir=/cgroup
            - --pprof-port=0
            - --enable-syscall-to-profile-correlation=true
            - --enable-web-app-process-exec-filtering=false
            - --profiles-otlp-endpoint=miggo-collector.miggo-space.svc.cluster.local:4317
            - --profiler-reporter-interval=5s
            - --profiler-samples-per-second=20
            - --profiler-monitor-interval=5s
            - --profiler-probabilistic-threshold=100
            - --profiler-probabilistic-interval=1m0s
            - --profiler-tracers=perl,php,python,hotspot,v8,go
            - --profiler-load-probe=true
            - --include-system-namespaces=false
            - --denied-namespaces=miggo-space
            - --enable-syscall-to-profile-correlation=false

  # profiler.extraArgs render as --profiler-<key> on the runtime, after every flag above.
  - it: places profiler extraArgs after the flag enableDetections renders
    template: templates/miggo-runtime/daemonset.yaml
    chart:
      version: '1.0.0'
      appVersion: '1.0.0'
    set:
      config.enableDetections: true
      miggoRuntime.profiler.extraArgs.load-probe: false
    asserts:
      - isKind:
          of: DaemonSet
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].args
          value:
            - --cluster-name=detections-test
            - --platform=kubernetes
            - --otlp-endpoint=http://miggo-collector.miggo-space.svc.cluster.local:4318
            - --collector-healthcheck-port=6666
            - --tls-skip-verify=false
            - --stdout=false
            - --port=6666
            - --metric-otlp-endpoint=http://miggo-collector.miggo-space.svc.cluster.local:4318
            - --metric-tls-skip-verify=false
            - --metric-interval=60s
            - --chart-version=1.0.0
            - --enable-network-tracing=false
            - --enable-file-access-tracing=false
            - --enable-web-app-process-detection=true
            - --cgroup-registry-sync-interval=1m
            - --cgroup-registry-clean-interval=1h
            - --cgroup-root-dir=/cgroup
            - --pprof-port=0
            - --enable-syscall-to-profile-correlation=true
            - --enable-web-app-process-exec-filtering=false
            - --profiles-otlp-endpoint=miggo-collector.miggo-space.svc.cluster.local:4317
            - --profiler-reporter-interval=5s
            - --profiler-samples-per-second=20
            - --profiler-monitor-interval=5s
            - --profiler-probabilistic-threshold=100
            - --profiler-probabilistic-interval=1m0s
            - --profiler-tracers=perl,php,python,hotspot,v8,go
            - --profiler-load-probe=true
            - --include-system-namespaces=false
            - --denied-namespaces=miggo-space
            - --profiler-load-probe=false

  - it: installs nothing when the runtime is disabled
    template: templates/miggo-runtime/daemonset.yaml
    set:
      config.enableDetections: true
      miggoRuntime.enabled: false
    asserts:
      - hasDocuments:
          count: 0
