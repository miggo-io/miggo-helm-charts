suite: security context

release:
  name: miggo
  namespace: miggo-space

templates:
  - templates/miggo-watch/deployment.yaml
  - templates/miggo-scanner/deployment.yaml
  - templates/miggo-collector/deployment.yaml
  - templates/miggo-collector/collector-config-cm.yaml
  - templates/miggo-collector/diagnostic-pprof-config-cm.yaml
  - templates/miggo-collector/heartbeat-debug-config-cm.yaml
  - templates/miggo-runtime/daemonset.yaml

values:
  - values.yaml

tests:
  # --- defaults ---

  - it: watch container runs as 65532 non-root, with no pod-level security context
    template: templates/miggo-watch/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-watch")].securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-watch")].securityContext.runAsGroup
          value: 65532
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-watch")].securityContext.runAsNonRoot
          value: true
      - notExists:
          path: spec.template.spec.securityContext

  - it: scanner container runs as 65532 non-root, with no pod-level security context
    template: templates/miggo-scanner/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-scanner")].securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-scanner")].securityContext.runAsGroup
          value: 65532
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-scanner")].securityContext.runAsNonRoot
          value: true
      - notExists:
          path: spec.template.spec.securityContext

  - it: collector main and init containers run as 65532 non-root, pod has fsGroup 65532
    template: templates/miggo-collector/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-collector")].securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-collector")].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "collector-init-container")].securityContext.runAsUser
          value: 65532
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "collector-init-container")].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 65532

  - it: runtime pod is pinned to explicit root and the container holds the sensor capabilities
    template: templates/miggo-runtime/daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 0
      - notExists:
          path: spec.template.spec.securityContext.runAsNonRoot
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].securityContext
          value:
            privileged: true
            seccompProfile:
              type: RuntimeDefault

  # The profiler runs inside miggo-runtime, so profiler.securityContext no longer applies.
  - it: profiler.securityContext does not change the runtime container
    template: templates/miggo-runtime/daemonset.yaml
    set:
      miggoRuntime.profiler.securityContext.privileged: false
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].securityContext
          value:
            privileged: true
            seccompProfile:
              type: RuntimeDefault

  - it: non-privileged deployments pin the linux node selector
    templates:
      - templates/miggo-watch/deployment.yaml
      - templates/miggo-scanner/deployment.yaml
      - templates/miggo-collector/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/os"]
          value: linux

  # --- per-component overrides ---

  - it: a container-level override merges into the component default
    template: templates/miggo-watch/deployment.yaml
    set:
      miggoWatch.securityContext:
        runAsUser: 1234
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-watch")].securityContext.runAsUser
          value: 1234
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-watch")].securityContext.runAsNonRoot
          value: true

  - it: a default key is dropped by setting it to null
    template: templates/miggo-watch/deployment.yaml
    set:
      miggoWatch.securityContext.runAsNonRoot: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "miggo-watch")].securityContext.runAsNonRoot
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-watch")].securityContext.runAsUser
          value: 65532

  - it: a pod-level override replaces the component default
    template: templates/miggo-collector/deployment.yaml
    set:
      miggoCollector.podSecurityContext:
        fsGroup: 2000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000

  - it: the runtime container can be made unprivileged with its own capabilities
    template: templates/miggo-runtime/daemonset.yaml
    set:
      miggoRuntime.securityContext.privileged: false
      miggoRuntime.securityContext.capabilities.add: [SYS_ADMIN]
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].securityContext.privileged
          value: false
      - contains:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].securityContext.capabilities.add
          content: SYS_ADMIN
      - equal:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].securityContext.seccompProfile.type
          value: RuntimeDefault

  # --- opting out ---

  - it: emptying a component's values renders no security context at all
    templates:
      - templates/miggo-watch/deployment.yaml
      - templates/miggo-scanner/deployment.yaml
    set:
      miggoWatch.securityContext: null
      miggoWatch.podSecurityContext: null
      miggoScanner.securityContext: null
      miggoScanner.podSecurityContext: null
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
      - notExists:
          path: spec.template.spec.containers[0].securityContext

  - it: emptying the runtime values drops both the pod and container contexts
    template: templates/miggo-runtime/daemonset.yaml
    set:
      miggoRuntime.securityContext: null
      miggoRuntime.podSecurityContext: null
      miggoRuntime.profiler.securityContext: null
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
      - notExists:
          path: spec.template.spec.containers[?(@.name == "miggo-runtime")].securityContext
