---
# Source: miggo/templates/miggo-runtime/daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: example-runtime
  namespace: default
  labels:
    helm.sh/chart: miggo-0.0.245
    app.kubernetes.io/name: miggo
    app.kubernetes.io/instance: example
    app.kubernetes.io/version: "v26.1026.1"
    app.kubernetes.io/managed-by: Helm
  annotations:
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: miggo-runtime
      app.kubernetes.io/instance: example
  template:
    metadata:
      annotations:
      labels:
        component: miggo-runtime
        helm.sh/chart: miggo-0.0.245
        app.kubernetes.io/name: miggo-runtime
        app.kubernetes.io/instance: example
        app.kubernetes.io/version: "v26.1026.1"
        app.kubernetes.io/managed-by: Helm
        miggo.io/pprof-port: "6050"
    spec:
      imagePullSecrets:
        
        - name: miggo-regcred
      serviceAccountName: example-runtime
      securityContext:
        runAsGroup: 0
        runAsUser: 0
      containers:
        - name: miggo-runtime
          securityContext:
            privileged: true
            seccompProfile:
              type: RuntimeDefault
          image: "registry.miggo.io/miggo/miggo-runtime:v26.1026.1"
          imagePullPolicy: IfNotPresent
          args:
            - --cluster-name=my-cluster
            - --platform=kubernetes
            - --otlp-endpoint=http://miggo-collector.default.svc.cluster.local:4318
            - --collector-healthcheck-port=6666
            - --tls-skip-verify=false
            - --stdout=false
            - --port=6666
            - --metric-otlp-endpoint=http://miggo-collector.default.svc.cluster.local:4318
            - --metric-tls-skip-verify=false
            - --metric-interval=60s
            - --chart-version=0.0.245
            - --enable-network-tracing=false
            - --enable-file-access-tracing=false
            - --enable-web-app-process-detection=true
            - --cgroup-registry-sync-interval=1m
            - --cgroup-registry-clean-interval=1h
            - --cgroup-root-dir=/cgroup
            - --pprof-port=6050
            - --enable-syscall-to-profile-correlation=false
            - --enable-web-app-process-exec-filtering=true
            
            - --profiles-otlp-endpoint=miggo-collector.default.svc.cluster.local:4317
            - --profiler-reporter-interval=5s
            - --profiler-samples-per-second=20
            - --profiler-monitor-interval=5s
            - --profiler-probabilistic-threshold=100
            - --profiler-probabilistic-interval=1m0s
            - --profiler-tracers=perl,php,python,hotspot,v8,go
            - --profiler-load-probe=false
            - --include-system-namespaces=false
            - --denied-namespaces=default
          
          envFrom:
          env:
          - name: GOMEMLIMIT
            value: "560MiB"
          - name: MIGGO_RUNTIME_ENABLE_CGROUP_FILTER
            value: "true"
          - name: MIGGO_RUNTIME_CLUSTER_NAME
            value: my-cluster
          - name: MIGGO_RUNTIME_PLATFORM
            value: kubernetes
          - name: MIGGO_RUNTIME_NODE_NAME
            valueFrom:
              fieldRef:
                fieldPath: spec.nodeName
          - name: MIGGO_RUNTIME_INSTANCE_ID
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: KUBERNETES_CLUSTER_DOMAIN
            value: 
          ports:
          - containerPort: 6666
          livenessProbe:
            httpGet:
              path: /health
              port: 6666
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 6666
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            limits:
              cpu: 500m
              memory: 700Mi
            requests:
              cpu: 100m
              memory: 700Mi
          volumeMounts:
          - name: debugfs
            mountPath: /sys/kernel/debug
            readOnly: true
          - name: tracefs
            mountPath: /sys/kernel/tracing
            readOnly: true
          - name: cgroupfs
            mountPath: /cgroup
            readOnly: true
      hostIPC: true
      hostPID: true
      volumes:
      - name: debugfs
        hostPath:
          path: /sys/kernel/debug
      - name: tracefs
        hostPath:
          path: /sys/kernel/tracing
      - name: cgroupfs
        hostPath:
          path: /sys/fs/cgroup
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-node-critical


